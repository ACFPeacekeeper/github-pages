name: Benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "src/**"
      - "public/**"

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Serve static export
        run: npx serve@latest out -l 3000 &
      - name: Wait for server
        run: npx wait-on http://localhost:3000/github-pages
      - name: Run Lighthouse
        run: npx lighthouse http://localhost:3000/github-pages --output=json --output-path=./lighthouse-report.json --chrome-flags="--headless --no-sandbox"
      - uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: lighthouse-report.json
