# Pre-commit hooks for this repository.
#
# Install once: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files
# Update hooks: pre-commit autoupdate
#
# Gate philosophy:
#   - Blocking: eslint, ruff
#   - Advisory: tsc, mypy

repos:
  # ── General file hygiene ─────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=5000]
      - id: mixed-line-ending
        args: [--fix=lf]

  # ── TypeScript / React: eslint (blocking) ────────────────────────────────
  - repo: local
    hooks:
      - id: eslint
        name: eslint (src/, app/)
        language: system
        entry: npm run lint --
        pass_filenames: false
      - id: tsc-check
        name: TypeScript type check (advisory)
        language: system
        entry: bash -c 'npx tsc --noEmit'
        files: \.(ts|tsx)$
        pass_filenames: false

  # ── Python (notebooks/): ruff (blocking) + mypy (advisory) ───────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi]
        files: ^notebooks/
      - id: ruff-format
        types_or: [python, pyi]
        files: ^notebooks/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.1
    hooks:
      - id: mypy
        name: mypy (notebooks/)
        args: [--ignore-missing-imports, --no-error-summary]
        files: ^notebooks/.*\.py$

  # ── Markdown: link checker ───────────────────────────────────────────────
  - repo: https://github.com/lycheeverse/lychee
    rev: lychee-v0.15.1
    hooks:
      - id: lychee
        name: lychee (markdown link check)
        args:
          - --verbose
          - --no-progress
          - --include-verbatim
        files: \.(md|markdown)$
        pass_filenames: true

  # ── Jupyter: strip notebook output from git ──────────────────────────────
  - repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
      - id: nbstripout
        files: ^notebooks/.*\.ipynb$
