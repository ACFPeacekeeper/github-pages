server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Next.js static export: try the exact path, then a trailing-slash
    # index.html, then fall back to the custom 404 page.
    location / {
        try_files $uri $uri.html $uri/index.html /404.html;
    }

    error_page 404 /404.html;
}
