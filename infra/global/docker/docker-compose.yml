# Local stack: builds the static export and serves it via nginx.
#
# Usage (from the repo root):
#   docker compose -f infra/global/docker/docker-compose.yml up --build

services:
  site:
    build:
      context: ../../..
      dockerfile: infra/global/docker/Dockerfile
    ports:
      - "8080:80"
    restart: unless-stopped
