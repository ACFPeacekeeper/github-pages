apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: github-pages-prod

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: github-pages
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: github-pages:latest
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "500m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "256Mi"
