apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: github-pages
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: github-pages.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: github-pages
                port:
                  number: 80
