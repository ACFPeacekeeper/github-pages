apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: github-pages-dev

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: github-pages
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: github-pages:dev
